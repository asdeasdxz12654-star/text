testpaths = tests
[pytest]
# Generate both JUnit XML and HTML reports, with benchmarks
addopts = -q --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html --maxfail=1 --benchmark-only --benchmark-autosave
testpaths = tests
markers =
    e2e: end-to-end tests
    login: login-related tests
    smoke: quick smoke tests
    performance: performance and timing tests
    accessibility: accessibility (a11y) tests
    visual: visual regression tests
