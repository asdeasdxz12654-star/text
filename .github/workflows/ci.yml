name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to test"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      headed:
        description: "Run in headed mode"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [3.10, 3.11]
        browser: ["chromium", "firefox", "webkit"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ matrix.python }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-cache-${{ matrix.python }}-

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ matrix.python }}

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests (pytest)
        env:
          BROWSER: ${{ matrix.browser }}
          HEADED: ${{ github.event.inputs.headed || false }}
          CI: "1"
        run: |
          mkdir -p reports || true
          python -m pytest -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python }}-${{ matrix.browser }}
          path: |
            reports/
            test-results/
            playwright-report/
