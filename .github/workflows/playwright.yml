name: Playwright (Python) tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ matrix.browser }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install ${{ matrix.browser }} --with-deps

      - name: Run tests and produce reports
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p results/screenshots
          pytest -q --browser=${{ matrix.browser }} --junitxml=results/junit-${{ matrix.browser }}.xml --html=results/report-${{ matrix.browser }}.html || true

      - name: Upload junit/html results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.browser }}
          path: |
            results/junit-${{ matrix.browser }}.xml
            results/report-${{ matrix.browser }}.html

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: results/screenshots

      - name: Post test results to GitHub Checks
        if: always() && exists('results/junit-${{ matrix.browser }}.xml')
        uses: dorny/test-reporter@v1
        with:
          name: pytest-${{ matrix.browser }}
          path: results/junit-${{ matrix.browser }}.xml
          reporter: junit
